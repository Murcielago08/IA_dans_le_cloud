<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subtitler</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="bar">
      <div class="brand">Sub<span>titler</span></div>
      <nav>
        <a href="index.html" aria-current="page">Transcrire</a>
        <a href="admin.html">Administration</a>
      </nav>
    </div>
  </header>

  <main>
    <h1>Transcrire une vidéo ou un audio</h1>
    <p class="lead">Les fichiers sont traités sur nos serveurs, ils ne sont jamais envoyés à un service externe.</p>

    <form id="upload-form" class="card">
      <span class="label">1. Fichier</span>
      <label class="drop" id="drop">
        <input type="file" id="file" name="file" accept=".mp4,.wav,video/mp4,audio/wav" required>
        <strong id="drop-title">Déposez un fichier ou cliquez pour choisir</strong>
        <small id="drop-hint">Vidéo .mp4 ou audio .wav</small>
      </label>

      <span class="label">2. Résultat souhaité</span>
      <div class="outputs" id="outputs">
        <label class="output">
          <input type="radio" name="output_kind" value="video_embedded" data-video-only>
          <b>Vidéo sous-titrée</b>
          <small>Sous-titres incrustés dans l'image</small>
        </label>
        <label class="output">
          <input type="radio" name="output_kind" value="video_track" data-video-only>
          <b>Vidéo + piste</b>
          <small>Sous-titres activables dans le lecteur</small>
        </label>
        <label class="output">
          <input type="radio" name="output_kind" value="subtitles" checked>
          <b>Sous-titres seuls</b>
          <small>Fichier .srt horodaté</small>
        </label>
        <label class="output">
          <input type="radio" name="output_kind" value="text">
          <b>Texte seul</b>
          <small>Transcription sans horodatage</small>
        </label>
      </div>

      <label class="label" for="model">3. Modèle</label>
      <select id="model" name="model"></select>

      <div class="actions">
        <button type="submit" id="submit">Lancer la transcription</button>
        <div class="progress" id="progress" hidden><div></div></div>
      </div>
      <p class="message" id="message" hidden></p>
    </form>

    <section class="card">
      <h2>Mes traitements</h2>
      <p class="empty" id="empty">Aucun traitement pour l'instant.</p>
      <ul class="jobs" id="jobs"></ul>
    </section>
  </main>

  <template id="job-template">
    <li class="job">
      <div class="job-head">
        <div>
          <div class="job-name"></div>
          <div class="job-meta"></div>
        </div>
        <span class="badge"></span>
        <div class="job-actions">
          <button type="button" class="btn-ghost preview-btn" hidden>Aperçu</button>
          <a class="btn btn-ghost download-btn" hidden>Télécharger</a>
        </div>
      </div>
      <div class="job-error" hidden></div>
      <div class="preview" hidden></div>
    </li>
  </template>

  <script src="common.js"></script>
  <script src="app.js"></script>
</body>
</html>
