name: CI

on:
  push:
    branches: [main]
    paths: ["Projet/**", "pytest.ini", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["Projet/**", "pytest.ini", ".github/workflows/ci.yml"]
  workflow_dispatch:

jobs:
  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Projet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Projet/requirements*.txt

      - name: Installer ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # Les tests utilisent un faux modèle : ni torch ni GPU nécessaires.
      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lancer les tests
        run: pytest -v

  docker:
    name: Image Docker (build + démarrage)
    runs-on: ubuntu-latest
    needs: tests
    defaults:
      run:
        working-directory: Projet
    steps:
      - uses: actions/checkout@v4

      # Variante CPU : même Dockerfile, sans les plusieurs Go de CUDA.
      - name: Construire l'image
        run: docker build --build-arg TORCH_INDEX=https://download.pytorch.org/whl/cpu -t subtitler:ci .

      - name: Démarrer le conteneur et vérifier qu'il répond
        run: |
          docker run -d --name subtitler -p 8000:8000 \
            -e SUBTITLER_DEVICE=cpu \
            -e SUBTITLER_ADMIN_USERNAME=admin -e SUBTITLER_ADMIN_PASSWORD=ci-password \
            subtitler:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health; then
              curl -fsS http://127.0.0.1:8000/api/info > /dev/null
              curl -fsS -o /dev/null http://127.0.0.1:8000/login.html
              echo " -> le conteneur répond"
              exit 0
            fi
            sleep 2
          done
          docker logs subtitler
          exit 1

      - name: Logs du conteneur
        if: always()
        run: docker logs subtitler || true
